name: validate

on:
  pull_request:
    paths:
      - "**/SKILL.md"
      - "**/references/**"
      - ".github/scripts/validate-skills.mjs"
      - ".github/workflows/validate.yml"
  push:
    branches: [master]
    paths:
      - "**/SKILL.md"
      - "**/references/**"
      - ".github/scripts/validate-skills.mjs"
      - ".github/workflows/validate.yml"

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"

      # Validate package structure, frontmatter, size limits,
      # and local reference paths.
      - name: Validate skill packages
        run: node .github/scripts/validate-skills.mjs

      # Verify that each skill can be installed through the official CLI.
      - name: Test skill install
        run: |
          set -euo pipefail
          shopt -s nullglob

          skill_files=(*/SKILL.md)

          if ((${#skill_files[@]} == 0)); then
            echo "::error::No root-level skill packages found"
            exit 1
          fi

          for skill_md in "${skill_files[@]}"; do
            skill="${skill_md%/SKILL.md}"

            npx --yes skills@1.5.20 add "$GITHUB_WORKSPACE" \
              --skill "$skill" \
              --agent universal \
              --copy \
              --global \
              --yes

            install_path="$HOME/.config/agents/skills/$skill"

            if [ ! -f "$install_path/SKILL.md" ]; then
              echo "::error::$skill was not installed at $install_path"
              exit 1
            fi

            if [ -d "$skill/references" ] &&
               [ ! -d "$install_path/references" ]; then
              echo "::error::$skill references/ directory was not installed"
              exit 1
            fi

            echo "$skill installed and verified at $install_path"
          done
